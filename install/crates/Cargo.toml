# The installer's crates.io dependencies, for crate_universe (@installer_crates, crates.MODULE.bazel) and cargo-deny.
# The package has no code of its own: lib.rs does not exist, and neither tool reads it.
[package]
name = "switch_installer_crates"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
path = "lib.rs"

[workspace]

[dependencies]
aea-tools = "0.1.1"
aes = "0.9"
ash = { version = "0.38", default-features = false, features = ["std"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
cmpfs = "0.1.0"
crc32c = "0.6"
crc32fast = "1.5"
crossterm = "0.29"
ctr = "0.10"
ferrosys-ucd = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
hadris-fat = { version = "2.5", default-features = false, features = [
  "lfn",
  "read",
  "std",
  "sync",
  "unstable-exfat",
  "write",
] }
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
image4 = "0.8.2"
libc = "0.2"
lz4-sys = "1.11.1"
lzfse_rust = "0.2.1"
mbrman = "0.7"
object = { version = "0.41", default-features = false, features = ["macho", "read_core", "std", "write_std"] }
plist = "1.10"
quick-xml = "0.42"
ratatui = "0.30"
rayon = "1.12"
reqwest = { version = "0.13", features = ["blocking", "json", "stream"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
sha2_0_10 = { package = "sha2", version = "0.10.9" }
tar = "0.4.46"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
udif = "0.4.2"
unicode-normalization = "0.1.26"
zbitmap = "0.1.0"
zerocopy = { version = "0.8", features = ["derive"] }

# aws-lc-sys assembles x86-64 with NASM on Windows; prebuilt-nasm links its pre-assembled objects instead. rustls
# turns it on today as well; this keeps it on if rustls stops.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
aws-lc-rs = { version = "1", default-features = false, features = ["prebuilt-nasm"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "CFArray",
  "CFDictionary",
  "CFNumber",
  "CFString",
  "CFURL",
  "std",
] }
objc2-disk-arbitration = { version = "0.3.2", default-features = false, features = [
  "DADisk",
  "DADissenter",
  "DASession",
  "dispatch2",
  "libc",
  "std",
] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["libc", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
udisks2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
apfs = "0.4.1"
tempfile = "3"
