# cargo-deny 0.20 (:deny_test). It refuses every licence that isn't allowed here, so GPL-2.0-only, AGPL and CDLA are
# refused by not being listed.
[graph]
# Only the installer's six targets: webpki-root-certs (CDLA-Permissive-2.0) is a dependency for wasm32 alone.
targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-musl",
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "GPL-2.0-or-later",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "ISC",
  "LGPL-2.0-only",
  "LGPL-2.0-or-later",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# libbz2-rs-sys, udif's pure-Rust bzip2, carries bzip2's own BSD-style licence. Allowed for that crate alone.
[[licenses.exceptions]]
allow = ["bzip2-1.0.6"]
crate = "libbz2-rs-sys"

[licenses.private]
ignore = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"
