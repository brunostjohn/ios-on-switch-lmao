name: Save the Bazel disk cache
description: Saves the disk cache entries this run read or wrote, for the job's next run (including partial progress on failure).
inputs:
  cache:
    description: The disk cache's name, as given to the bazel action.
    required: true
  prune:
    description: Drop entries untouched by this run before saving (true on success, false on failure to keep prior warm entries).
    default: "true"
runs:
  using: composite
  steps:
    # Bazel refreshes an entry's mtime whenever it reads it, the action result before its blobs, so no result kept here
    # loses a blob. On a failed run we keep previously restored entries alongside newly succeeded actions so the next
    # run starts warm instead of dropping progress.
    - name: Prepare disk cache for saving
      id: prep
      shell: bash
      env:
        PRUNE: ${{ inputs.prune }}
      run: |
        disk=~/Library/Caches/switch-ios-bazel/disk
        marker="$RUNNER_TEMP/bazel-disk-cache-start"
        if [ ! -d "$disk" ] || [ ! -f "$marker" ]; then
          echo "save=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "$(find "$disk" -type f -newer "$marker" -print -quit)" ]; then
          echo "No new Bazel disk cache entries written in this run; skipping cache save."
          echo "save=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$PRUNE" = "true" ]; then
          find "$disk" -type f ! -newer "$marker" -delete
        fi
        du -sh "$disk" || true
        echo "save=true" >> "$GITHUB_OUTPUT"
    - if: steps.prep.outputs.save == 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: ~/Library/Caches/switch-ios-bazel/disk
        key: bazel-disk-${{ inputs.cache }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
