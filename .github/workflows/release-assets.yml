name: Release assets
on:
  workflow_call:
    inputs:
      tag:
        description: The tag being released, which must equal MODULE.bazel's version. Empty outside a release.
        type: string
        default: ""
      upload:
        description: Whether the run writes the caches.
        type: boolean
        default: false
    secrets:
      BUILDBUDDY_API_KEY:
        required: false
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  rbe-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      cluster-id: ${{ steps.check.outputs.cluster-id }}
    steps:
      - name: Check Tailscale RBE credentials
        id: check
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if [ -n "$TS_OAUTH_CLIENT_ID" ] && [ -n "$TS_OAUTH_SECRET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          echo "cluster-id=rel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
  rbe-bins:
    needs: rbe-prepare
    if: needs.rbe-prepare.outputs.enabled == 'true'
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore or cache Buildbarn binaries
        id: bb-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Caches/switch-ios-buildbarn-bin
          key: buildbarn-darwin-arm64-${{ hashFiles('tools/remote/bb_worker-clonefile.diff', 'tools/remote/bb_worker-slots.diff', 'tools/remote/ci/build-buildbarn.sh') }}
      - name: Build patched Buildbarn binaries
        if: steps.bb-cache.outputs.cache-hit != 'true'
        run: ./tools/remote/ci/build-buildbarn.sh ~/Library/Caches/switch-ios-buildbarn-bin
  rbe-worker:
    needs: [rbe-prepare, rbe-bins]
    if: needs.rbe-prepare.outputs.enabled == 'true'
    continue-on-error: true
    runs-on: xcode-27
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/Library/Caches/switch-ios-buildbarn-bin
          key: buildbarn-darwin-arm64-${{ hashFiles('tools/remote/bb_worker-clonefile.diff', 'tools/remote/bb_worker-slots.diff', 'tools/remote/ci/build-buildbarn.sh') }}
          fail-on-cache-miss: true
      - name: Run ephemeral Buildbarn worker
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/remote/ci/run-worker.sh ~/Library/Caches/switch-ios-buildbarn-bin "${{ needs.rbe-prepare.outputs.cluster-id }}" "${{ matrix.worker }}" "build"
  build:
    needs: [rbe-prepare, rbe-bins]
    if: ${{ !cancelled() && (needs.rbe-bins.result == 'success' || needs.rbe-bins.result == 'skipped') }}
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/bazel
        with:
          cache: release
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          upload: ${{ inputs.upload }}
      - name: Restore Buildbarn binaries
        if: needs.rbe-prepare.outputs.enabled == 'true'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/Library/Caches/switch-ios-buildbarn-bin
          key: buildbarn-darwin-arm64-${{ hashFiles('tools/remote/bb_worker-clonefile.diff', 'tools/remote/bb_worker-slots.diff', 'tools/remote/ci/build-buildbarn.sh') }}
          fail-on-cache-miss: true
      - name: Start ephemeral Buildbarn coordinator
        if: needs.rbe-prepare.outputs.enabled == 'true'
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: ./tools/remote/ci/start-coordinator.sh ~/Library/Caches/switch-ios-buildbarn-bin "${{ needs.rbe-prepare.outputs.cluster-id }}" "${{ inputs.upload }}"
      - name: Read the version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(bazel mod graph --depth=0 --color=no 2>/dev/null | sed -n 's/^<root> (switch-ios@\(.*\))$/\1/p')"
          if [ -z "$version" ] || [ "$version" = _ ]; then
            echo "::error::MODULE.bazel's module() has no version."
            exit 1
          fi
          if [ -n "$TAG" ] && [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG is not MODULE.bazel's version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build release, desktop installer, seed smoke, and catalog targets
        run: |
          bazel build --config=release \
            //:boot //:gpu //release:assets \
            //release:installer_binaries //release:seed_smoke_binaries \
            //install/catalog:switch_catalog_tool //release:installer_kind_assets
      - name: Name the assets for the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dist="$RUNNER_TEMP/dist"
          catalogs="$RUNNER_TEMP/catalogs"
          seed_smoke="$RUNNER_TEMP/seed-smoke"
          mkdir -p "$dist" "$catalogs" "$seed_smoke"
          files="$(bazel cquery --config=release --output=files //release:assets)"
          for f in $files; do
            cp -L "$f" "$dist/ios-on-switch-lmao-$VERSION-$(basename "$f")"
          done
          for cfg in ios17 ios27; do
            bazel build --config="$cfg" --config=release //release:installer_kind_assets
            kind_files="$(bazel cquery --config="$cfg" --config=release --output=files //release:installer_kind_assets)"
            for f in $kind_files; do
              base="$(basename "$f")"
              if [ "$base" = "catalog.json" ]; then
                cp -fL "$f" "$catalogs/$cfg.json"
              elif [ -e "$dist/$base" ]; then
                if ! cmp -s "$f" "$dist/$base"; then
                  echo "::error::Shared release asset $base differs for --config=$cfg."
                  exit 1
                fi
              else
                cp -L "$f" "$dist/$base"
                chmod u+w "$dist/$base"
              fi
            done
          done
          catalog_tool="$(bazel cquery --config=release --output=files //install/catalog:switch_catalog_tool)"
          "$catalog_tool" \
            --merge "$catalogs/ios17.json" \
            --merge "$catalogs/ios27.json" \
            --require-role boot --require-role overlay --require-role bootstrap --require-role gpu --require-role seed \
            --assets-dir "$dist" \
            --out "$dist/catalog.json"
          python3 - "$dist/catalog.json" "$seed_smoke/synthetic-ios18-catalog.json" <<'PY'
          import copy, json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              cat = json.load(f)
          for rec in cat['builds']:
              for role, m in rec['members'].items():
                  aea = m.get('aea')
                  if aea is not None and 'key' in aea:
                      raise SystemExit(f"catalog leaked AEA key for {rec['build']} {role}")
          # Build a synthetic iOS 18 (22H124) record beside the real builds to verify data-driven planning across OSes.
          tmpl = copy.deepcopy(cat['builds'][-1])
          tmpl['build'] = '22H124'
          tmpl['version'] = '18.7.2'
          tmpl['ios'] = 18
          tmpl['xnu'] = '11417.140.69'
          tmpl['product'] = 'iPad11,1'
          tmpl['device_class'] = 'j210ap'
          tmpl['ipsw'] = {'url': 'https://updates.cdn-apple.com/2025/iPad_18.7.2_22H124_Restore.ipsw', 'size': 9876543210}
          tmpl['volumes']['os_volume_uuid'] = '00000000-1111-2222-3333-444444444444'
          tmpl['members']['os']['aea'] = {'raw_size': 9000000000}
          cat['builds'].append(tmpl)
          with open(sys.argv[2], 'w', encoding='utf-8') as f:
              json.dump(cat, f, indent=2)
              f.write('\n')
          PY
          bins="$(bazel cquery --config=release --output=files //release:installer_binaries)"
          bin_count=0
          for f in $bins; do
            dir="$(basename "$(dirname "$f")")"
            plat="${dir#desktop_}"
            os="${plat%%_*}"
            cpu="${plat#*_}"
            ext=""
            case "$f" in
              *.exe) ext=".exe" ;;
            esac
            out="$dist/ios-on-switch-lmao-$VERSION-installer-$os-$cpu$ext"
            cp -L "$f" "$out"
            chmod +x "$out"
            bin_count=$((bin_count + 1))
          done
          if [ "$bin_count" -ne 6 ]; then
            echo "::error::Expected 6 desktop installer binaries, got $bin_count."
            exit 1
          fi
          mac_installer="$dist/ios-on-switch-lmao-$VERSION-installer-macos-arm64"
          "$mac_installer" --catalog "$seed_smoke/synthetic-ios18-catalog.json" --list-builds | grep -q '22H124'
          smoke_img="$RUNNER_TEMP/smoke-mac.img"
          truncate -s 64M "$smoke_img"
          "$mac_installer" --mode partition+install --build 22H124 --image "$smoke_img" --dry-run \
            --catalog "$seed_smoke/synthetic-ios18-catalog.json" --assets-dir "$dist" --no-tui
          seed_bins="$(bazel cquery --config=release --output=files //release:seed_smoke_binaries)"
          for f in $seed_bins; do
            dir="$(basename "$(dirname "$f")")"
            plat="${dir#desktop_}"
            case "$plat" in
              macos_arm64) cp -L "$f" "$seed_smoke/switch_seed-macos-arm64"; chmod +x "$seed_smoke/switch_seed-macos-arm64" ;;
              linux_x86_64) cp -L "$f" "$seed_smoke/switch_seed-linux-x86_64"; chmod +x "$seed_smoke/switch_seed-linux-x86_64" ;;
              windows_x86_64) cp -L "$f" "$seed_smoke/switch_seed-windows-x86_64.exe" ;;
            esac
          done
          for b in 21H461 24B119; do
            "$seed_smoke/switch_seed-macos-arm64" \
              --smoke-seed-tar "$dist/ios-on-switch-lmao-$VERSION-seed-$b.tar" \
              --work-dir "$RUNNER_TEMP/seed-repro-$b" \
              > "$seed_smoke/repro-$b.txt"
            cat "$seed_smoke/repro-$b.txt"
          done
          cd "$dist"
          shasum -a 256 -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: seed-smoke
          path: ${{ runner.temp }}/seed-smoke
          if-no-files-found: error
      - if: inputs.upload && !cancelled()
        uses: ./.github/actions/bazel-save
        with:
          cache: release
      - name: Stop ephemeral Buildbarn coordinator
        if: always() && needs.rbe-prepare.outputs.enabled == 'true'
        run: ./tools/remote/ci/stop-coordinator.sh
  bazelisk-only:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - name: Remove Xcode and the Command Line Tools
        run: |
          mkdir "$RUNNER_TEMP/xcode"
          for app in /Applications/Xcode*.app; do
            sudo mv "$app" "$RUNNER_TEMP/xcode/"
          done
          sudo rm -rf /Library/Developer/CommandLineTools
          sudo xcode-select --reset
          if xcode-select -p; then
            echo "::error::A developer directory is still selected."
            exit 1
          fi
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - bazel/desktop/repos.bzl
            - bazel/lint/tools.bzl
            - bazel/llvm/llvm.bzl
            - bazel/python/requirements_lock.txt
            - bazel/rust/crates.lock.json
            - gpu/deps.bzl
            - install/crates/crates.lock.json
            - ipsw/pins.bzl
            - third_party/mesa/bazel/repos.bzl
          cache-save: false
          bazelrc: build --show_progress_rate_limit=30
      # The action graph, before anything runs: a regression is named by its actions, not by the first one to fail.
      - name: Check the image builder runs no compiler and nothing of Xcode
        env:
          ASSETS: ${{ runner.temp }}/assets
        run: |
          flags=(--repo_env=SWITCH_RELEASE_DIR="$ASSETS" --//install:prebuilt=release --output=text --include_commandline=false)
          graph='deps(//:image_dry_run)'
          xcode="$(bazel aquery "${flags[@]}" "inputs('.*external/(\+xcode_host\+xcode|apple_support\+|[^/]*local_config_[^/]*cc[^/]*)/.*', $graph)")"
          compiles="$(bazel aquery "${flags[@]}" "mnemonic('(Cpp|Objc|Swift|Rustc).*', $graph)")"
          found="$(printf '%s\n%s\n' "$xcode" "$compiles")"
          if grep -q '^action ' <<<"$found"; then
            grep -E "^action |^  (Mnemonic|Target):" <<<"$found"
            echo "::error:://:image_dry_run's graph has actions that need Xcode or a compiler."
            exit 1
          fi
      - name: Dry-run the image builder on this build's assets
        run: bazel run --repo_env=SWITCH_RELEASE_DIR="$RUNNER_TEMP/assets" --//install:prebuilt=release //:image_dry_run
  smoke-linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - uses: actions/download-artifact@v8.0.2
        with:
          name: seed-smoke
          path: ${{ runner.temp }}/seed-smoke
      - name: Smoke-test Linux x86_64 installer, synthetic iOS 18, and shader seed reproducibility
        run: |
          assets="$RUNNER_TEMP/assets"
          smoke="$RUNNER_TEMP/seed-smoke"
          bin="$(ls "$assets"/ios-on-switch-lmao-*-installer-linux-x86_64)"
          chmod +x "$bin" "$smoke/switch_seed-linux-x86_64"
          "$bin" --catalog "$assets/catalog.json" --list-builds
          img="$RUNNER_TEMP/smoke.img"
          truncate -s 64M "$img"
          for b in 21H461 24B119; do
            "$bin" --mode partition+install --build "$b" --image "$img" --dry-run \
              --catalog "$assets/catalog.json" --assets-dir "$assets" --no-tui
          done
          "$bin" --catalog "$smoke/synthetic-ios18-catalog.json" --list-builds | grep -q '22H124'
          "$bin" --mode partition+install --build 22H124 --image "$img" --dry-run \
            --catalog "$smoke/synthetic-ios18-catalog.json" --assets-dir "$assets" --no-tui
          for b in 21H461 24B119; do
            tar_file="$(ls "$assets"/ios-on-switch-lmao-*-seed-"$b".tar)"
            "$smoke/switch_seed-linux-x86_64" \
              --smoke-seed-tar "$tar_file" \
              --work-dir "$RUNNER_TEMP/repro-$b" \
              > "$RUNNER_TEMP/linux-repro-$b.txt"
            diff -u "$smoke/repro-$b.txt" "$RUNNER_TEMP/linux-repro-$b.txt"
          done
  smoke-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - uses: actions/download-artifact@v8.0.2
        with:
          name: seed-smoke
          path: ${{ runner.temp }}/seed-smoke
      - name: Smoke-test Windows x86_64 installer, synthetic iOS 18, and shader seed reproducibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $assets = Join-Path $env:RUNNER_TEMP 'assets'
          $smoke = Join-Path $env:RUNNER_TEMP 'seed-smoke'
          $bin = (Get-Item (Join-Path $assets 'ios-on-switch-lmao-*-installer-windows-x86_64.exe')).FullName
          & $bin --catalog (Join-Path $assets 'catalog.json') --list-builds
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $img = Join-Path $env:RUNNER_TEMP 'smoke.img'
          $fs = [System.IO.File]::OpenWrite($img)
          try { $fs.SetLength(64MB) } finally { $fs.Dispose() }
          foreach ($b in @('21H461', '24B119')) {
            & $bin --mode partition+install --build $b --image $img --dry-run `
              --catalog (Join-Path $assets 'catalog.json') --assets-dir $assets --no-tui
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $synth = Join-Path $smoke 'synthetic-ios18-catalog.json'
          $listOut = (& $bin --catalog $synth --list-builds) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $listOut -notmatch '22H124') {
            throw "Synthetic iOS 18 build missing from --list-builds"
          }
          & $bin --mode partition+install --build 22H124 --image $img --dry-run `
            --catalog $synth --assets-dir $assets --no-tui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $seedBin = Join-Path $smoke 'switch_seed-windows-x86_64.exe'
          foreach ($b in @('21H461', '24B119')) {
            $tar = (Get-Item (Join-Path $assets "ios-on-switch-lmao-*-seed-$b.tar")).FullName
            $work = Join-Path $env:RUNNER_TEMP "repro-$b"
            $actual = ((& $seedBin --smoke-seed-tar $tar --work-dir $work) -join "`n").TrimEnd()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $expected = ((Get-Content -Raw (Join-Path $smoke "repro-$b.txt")) -replace "`r`n", "`n").TrimEnd()
            if ($actual -ne $expected) {
              Write-Error "Windows shader seed output for $b differs from macOS arm64!`nExpected:`n$expected`nActual:`n$actual"
              exit 1
            }
          }
