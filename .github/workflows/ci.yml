name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  release:
    uses: ./.github/workflows/release-assets.yml
    with:
      upload: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
  lint:
    needs: release
    if: ${{ !cancelled() }}
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/bazel
        with:
          cache: lint
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          upload: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      # A build evaluates a module extension only when it needs one of its repositories, so a stale lockfile entry
      # otherwise fails only the job that does (@switch_release's: the release image dry run).
      - run: bazel mod deps --lockfile_mode=error
      - run: bazel test //:format_test //:lint_test //:clang_tidy_test
      - run: bazel run //tools/lint:py_owners
      - if: ${{ (success() || failure()) && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: ./.github/actions/bazel-save
        with:
          cache: lint
          prune: ${{ job.status == 'success' }}
  debug:
    needs: release
    if: ${{ !cancelled() }}
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/bazel
        with:
          cache: debug
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          upload: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: bazel test //...
      - if: ${{ (success() || failure()) && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: ./.github/actions/bazel-save
        with:
          cache: debug
          prune: ${{ job.status == 'success' }}
